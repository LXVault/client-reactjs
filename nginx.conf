server {
    # Render detects the open port automatically; 80 is fine for a static SPA.
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers ----
    # Declared once here and inherited by every location below. A location that
    # declares its own `add_header` silently discards the inherited set, which is
    # why the dotfile rule further down adds none.
    #
    # `always` is not optional: without it these headers are attached only to a
    # short list of success and redirect statuses, so a 404 or a 500 would go out
    # bare.
    #
    # On the policy, the two relaxations are deliberate:
    #
    #   style-src 'unsafe-inline' — the app sets 25 inline `style={{...}}` props
    #   across src/ and Vite does not extract them. Inline styles are not a
    #   script execution vector. It is here because the alternative is
    #   refactoring every styled element for a header, not because the browser
    #   was asked to be lenient.
    #
    #   connect-src https: — the browser calls the backend origin directly, and
    #   that origin is baked in at build time as VITE_API_URL, so this file
    #   cannot know it. Narrowing it to the exact origin needs a new Docker
    #   build argument and a coordinated redeploy of every deployment. Since
    #   script-src 'self' already prevents injected script from running, what
    #   this widens is only where the application's own JavaScript may send a
    #   request — which it can already choose. Tighten it deliberately, not by
    #   accident.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # This image only serves the built React app. API calls go straight from the
    # browser to the backend's own origin via the absolute VITE_API_URL baked in
    # at build time (see Dockerfile), so the backend must allow that origin with
    # CORS_ORIGIN. We intentionally do NOT reverse-proxy /api here: on platforms
    # like Render the frontend and backend are separate services with no shared
    # private hostname, so a hardcoded upstream (e.g. "backend") fails to resolve.

    # Dotfiles are never served. `.git` is the one that matters — an image that
    # ever shipped a repository would hand over its history. The pattern is
    # `/.` rather than `.` so that `/index.html`, whose dot is not directly after
    # the slash, still matches the fallback below. `.well-known` is excluded
    # because a terminator in front of this image may need it.
    location ~ /\.(?!well-known) {
        return 404;
    }

    # SPA fallback: route everything that isn't a real file to index.html so
    # client-side React Router can handle the path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
